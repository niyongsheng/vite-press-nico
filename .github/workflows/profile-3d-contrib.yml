name: GitHub-Profile-3D-Contrib

on:
  schedule: # 每天 18:00 UTC（北京时间次日 02:00）自动生成
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Generate 3D Contrib SVG
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Remove background rect from generated SVGs
        run: |
          for f in profile-3d-contrib/*.svg; do
            sed -i 's|<rect[^>]*class="fill-bg"[^>]*></rect>||g' "$f"
          done
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "chore: update 3d contrib svg"; then
            git push
          fi
